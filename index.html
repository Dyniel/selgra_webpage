<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELGRA PoC</title>
    <style>
        @keyframes move-stars {
            from { background-position: 0 0; }
            to { background-position: -10000px 5000px; }
        }
        body {
            background-color: #0a0e23;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="10" cy="10" r="1" fill="white"/><circle cx="50" cy="30" r="0.5" fill="white"/><circle cx="80" cy="70" r="1.2" fill="white"/><circle cx="30" cy="90" r="0.8" fill="white"/></svg>');
            animation: move-stars 200s linear infinite;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .hidden { display: none; }
        .login-container {
            padding: 2.5rem;
            background: rgba(12, 20, 69, 0.8);
            border: 1px solid #00aaff;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 170, 255, 0.5);
            backdrop-filter: blur(10px);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #00aaff;
            text-shadow: 0 0 10px #00aaff;
            margin-bottom: 1.5rem;
        }
        input[type="text"], input[type="password"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #00aaff;
            background-color: #1a233a;
            color: white;
        }
        input[type="text"]::placeholder, input[type="password"]::placeholder {
            color: #ccc;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 1rem;
            border: none;
            border-radius: 5px;
            background-color: #00aaff;
            color: #0a0e23;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        button:hover {
            background-color: #33bbff;
            box-shadow: 0 0 15px #00aaff;
        }
        .flash-error {
            background-color: #ff4d4d;
            color: white;
            padding: 1rem;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 1rem;
        }
        .dashboard {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        nav {
            display: flex;
            justify-content: flex-end;
            padding: 1.5rem;
            background-color: rgba(0,0,0,0.3);
            border-bottom: 1px solid #00aaff;
        }
        nav a {
            color: #00aaff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s, text-shadow 0.3s;
        }
        nav a:hover {
            color: #fff;
            text-shadow: 0 0 10px #00aaff;
        }
        header {
            text-align: center;
            padding: 2rem 0;
        }
        main {
            flex-grow: 1;
            overflow-y: auto;
            padding: 2rem;
        }
        .admin-panel {
            background-color: rgba(0, 170, 255, 0.1);
            border: 1px solid #00aaff;
            border-radius: 8px;
            padding: 1rem;
            margin: 0 auto 2rem auto;
            max-width: 80%;
            text-align: center;
        }
        .content-wrapper {
            display: flex;
            gap: 2rem;
            justify-content: center;
        }
        .social-feed, .google-calendar {
            flex: 1;
            max-width: 600px;
            background-color: rgba(12, 20, 69, 0.7);
            border: 1px solid #00aaff;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.3);
            height: 70vh;
            overflow-y: auto;
        }
        .google-calendar iframe {
            border-radius: 8px;
        }
        .juicer-feed { background-color: transparent !important; }
        .juicer-feed .j-header { display: none !important; }
        .juicer-feed .j-post {
            background-color: rgba(26, 35, 58, 0.8) !important;
            border-radius: 8px !important;
            border: 1px solid #00aaff !important;
            color: #fff !important;
        }
        .juicer-feed .j-post a { color: #00aaff !important; }
    </style>
</head>
<body>

    <!-- Login View -->
    <div id="login-view">
        <div class="login-container">
            <div id="flash-message" class="flash-error hidden"></div>
            <form id="login-form">
                <h2>Login</h2>
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <!-- Dashboard View (Initially Hidden) -->
    <div id="dashboard-view" class="dashboard hidden">
        <nav>
            <a href="#" id="logout-button">Logout</a>
        </nav>
        <header>
            <h1>Welcome to SELGRA</h1>
        </header>
        <main>
            <div id="admin-panel" class="admin-panel hidden">
                <h3>Admin Instructions</h3>
                <p>This is a static PoC. To update content, edit the <code>index.html</code> file directly.</p>
            </div>
            <div class="content-wrapper">
                <section class="social-feed">
                    <h2>Social Feed</h2>
                    <script src="https://assets.juicer.io/embed.js" type="text/javascript"></script>
                    <link href="https://assets.juicer.io/embed.css" media="all" rel="stylesheet" type="text/css" />
                    <ul class="juicer-feed" data-feed-id="juicer"><h1 class="referral"><a href="https://www.juicer.io">Powered by Juicer</a></h1></ul>
                </section>
                <section class="google-calendar">
                    <h2>Calendar</h2>
                    <iframe src="https://calendar.google.com/calendar/embed?src=en.usa%23holiday%40group.v.calendar.google.com&ctz=America%2FNew_York" style="border: 0" width="100%" height="600" frameborder="0" scrolling="no"></iframe>
                </section>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const loginView = document.getElementById('login-view');
            const dashboardView = document.getElementById('dashboard-view');
            const loginForm = document.getElementById('login-form');
            const logoutButton = document.getElementById('logout-button');
            const adminPanel = document.getElementById('admin-panel');
            const flashMessage = document.getElementById('flash-message');

            // --- Mock Users ---
            const users = {
                "admin": { password: "admin", role: "admin" },
                "member": { password: "member", role: "member" }
            };

            function showFlashMessage(message) {
                flashMessage.textContent = message;
                flashMessage.classList.remove('hidden');
            }

            function hideFlashMessage() {
                flashMessage.classList.add('hidden');
            }

            function showLoginView() {
                loginView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
                document.body.style.alignItems = 'center';
            }

            function showDashboardView(userRole) {
                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                document.body.style.alignItems = 'flex-start';

                if (userRole === 'admin') {
                    adminPanel.classList.remove('hidden');
                } else {
                    adminPanel.classList.add('hidden');
                }
            }

            // --- Event Listeners ---
            loginForm.addEventListener('submit', function (event) {
                event.preventDefault();
                hideFlashMessage();

                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const user = users[username];

                if (user && user.password === password) {
                    // Simulate session by storing role in sessionStorage
                    sessionStorage.setItem('loggedInUserRole', user.role);
                    showDashboardView(user.role);
                } else {
                    showFlashMessage('Invalid username or password.');
                }
            });

            logoutButton.addEventListener('click', function (event) {
                event.preventDefault();
                sessionStorage.removeItem('loggedInUserRole');
                showLoginView();
            });

            // --- Initial State ---
            // Check if a user session exists on page load
            const loggedInUserRole = sessionStorage.getItem('loggedInUserRole');
            if (loggedInUserRole) {
                showDashboardView(loggedInUserRole);
            } else {
                showLoginView();
            }
        });
    </script>

</body>
</html>
